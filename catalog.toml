# starhub catalog — 唯一数据源。INDEX.md 与 README 的目录部分由 `bin/starhub index` 生成，不要手改。
#
# 字段说明
#   type     skill | tool | app | model | resource       （可组合，如 "tool+skill"）
#   host     vps      → skill/resource 拉到 VPS 的 vendor 库，按需读取
#            pc-home  → 工具/MCP/重型应用，装在工程机器上，经 desk 调用
#            remote   → 不落地，按需读 GitHub raw
#            hosted   → 用官方在线版
#            server   → 需独立服务器部署
#            none     → 暂不部署
#   status   inbox（新 star 待分拣）| backlog（待试）| trial（试用中）| active（主力）| archived（归档）
#   skills   仓库内 skill/资源目录（vendor 时只稀疏检出这些路径；空 = 整仓）
#   ref      固定的 commit；升级走 `starhub outdated` → 审查 → `starhub bump`
#   conflicts 功能重叠的项目，同一任务里只选一个

[meta]
github_user = "wenzhuofu"

[meta.categories]
design = "设计与前端审美"
diagram = "图表与可视化"
code-intel = "代码库理解"
agent-efficiency = "Agent 效率与约束"
knowledge = "知识转 Skill"
agent-infra = "Agent 基础设施"
intel = "信息监控与情报"
media = "内容创作"
domain = "专业领域"
security = "安全与逆向"
ops = "网络与运维"

