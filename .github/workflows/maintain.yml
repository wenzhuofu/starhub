# starhub 自动维护（可选）
# - 每月 1 日和 16 日运行一次，也可以在 Actions 页面手动触发
# - 不设置任何 secret：只做机械同步（新 star 进入 inbox）和复盘报告，零成本
# - 设置 secret ANTHROPIC_API_KEY：额外用 Claude 草拟 inbox 条目
#   默认模型 claude-haiku-5-5（最便宜）；要换模型，设置仓库变量 STARHUB_MODEL
# - 有改动就开 PR，由你审阅后合并；不会自动升级任何 ref
# - 要关闭：删掉下面的 schedule 段，或在 Actions 页面 Disable workflow
name: starhub maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 1,16 * *"   # UTC 01:00 = 北京时间 09:00

permissions:
  contents: write
  pull-requests: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync, triage, review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STARHUB_MODEL: ${{ vars.STARHUB_MODEL || 'claude-haiku-5-5' }}
        run: |
          python bin/starhub sync
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            pip install -q anthropic
            python bin/starhub triage
          fi
          python bin/starhub index
          python bin/starhub review > "$RUNNER_TEMP/review.md"
          cat "$RUNNER_TEMP/review.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then echo "目录无变化，报告见 Summary"; exit 0; fi
          branch="maintenance/$(date +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -qam "starhub: maintenance $(date +%F)"
          git push -q origin "$branch"
          gh pr create --title "starhub 维护 $(date +%F)" --body-file "$RUNNER_TEMP/review.md" \
            || echo "::warning::PR 创建失败：请在 Settings → Actions → General 勾选 Allow GitHub Actions to create and approve pull requests；分支 $branch 已推送"
